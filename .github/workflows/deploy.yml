name: Telegram TikTok Bot 24/7

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 */5 * * *"  # සෑම පැය 5කට වරක්ම නැවත ක්‍රියාත්මක වේ
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot and Waitress Server
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: python bot.py
