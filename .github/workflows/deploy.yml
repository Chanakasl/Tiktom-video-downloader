name: Deploy Telegram Bot to GitHub Actions

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 */5 * * *"  # සෑම පැය 5කට වරක්ම Action එක අලුත් වේ
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Flask & Bot Script Check
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        python -c "import bot; print('Bot script compiled successfully without errors!')"
